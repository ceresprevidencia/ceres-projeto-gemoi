name: Disparador Mercado de Crédito

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  disparar-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        # O comando 'cd' faz o terminal entrar na pasta do projeto antes de instalar
        run: |
          cd bot-mercado-de-credito
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar pipeline de notícias
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          GOOGLE_ALERTS_FEEDS: ${{ secrets.GOOGLE_ALERTS_FEEDS }}
        # Entra na pasta do projeto e roda o bot
        run: |
          cd bot-mercado-de-credito
          python pipeline_noticias.py

      - name: Commit e push do resultado
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Manda o git olhar apenas para as alterações dentro da pasta do bot
          git add bot-mercado-de-credito/

          if git diff --cached --quiet; then
            echo "Nada para commitar no bot de crédito"
            exit 0
          fi

          git commit -m "Atualizar estado do pipeline mercado de crédito [skip ci]"
          git push