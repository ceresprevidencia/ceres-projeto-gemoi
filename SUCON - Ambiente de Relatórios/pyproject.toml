[project]
name = "enquadramento"
version = "0.1.0"
description = ""
authors = [
    {name = "Arthur Braz",email = "68610129+TutuBraz@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "streamlit (>=1.55.0,<2.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "numpy (>=2.0.0,<3.0.0)",
    "plotly (>=6.6.0,<7.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "altair (>=5.0.0,<7.0.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "oracledb (>=3.4.2,<4.0.0)",
    "pyodbc (>=5.3.0,<6.0.0)",
    "python-dotenv (>=0.9.9,<0.10.0)",
    "reportlab (>=4.4.10,<5.0.0)",
    "google-api-python-client (>=2.198.0,<3.0.0)",
    "google-auth (>=2.55.2,<3.0.0)",
    "google-auth-oauthlib (>=1.4.0,<2.0.0)",
    "google-auth-httplib2 (>=0.4.0,<0.5.0)",
    "pillow (>=10.4.0,<12.0.0)"
]

[tool.poetry]
packages = [{include = "enquadramento", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
