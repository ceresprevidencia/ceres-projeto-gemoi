[server]
enableStaticServing = true

[[theme.fontFaces]]
family = "source-serif-4"
url = "app/static/SourceSerif4_18pt-SemiBoldItalic.ttf"
style = "italic"
weight = 600

[theme]
base = "light"
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap"
headingFont = "source-serif-4"
primaryColor = "#0b2f13"
backgroundColor = "#fafbeb"
secondaryBackgroundColor = "#f0f2e6"
textColor = "#0b2f13"
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#f6f8fa"

[theme.sidebar]
backgroundColor = "#f0f2e6"
secondaryBackgroundColor = "#e4e8d8"
textColor = "#0b2f13"
primaryColor = "#0b2f13"
borderColor = "#0b2f13"
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap"